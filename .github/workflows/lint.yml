name: lint

on:
  push:
  pull_request:

jobs:
  shellcheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: ShellCheck
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq shellcheck
          shellcheck --version
          export LANG=C.UTF-8
          shellcheck -x -S warning install.sh scripts/*.sh scripts/lib/*.sh
      - name: bash -n
        run: for f in install.sh scripts/*.sh scripts/lib/*.sh; do bash -n "$f"; done
